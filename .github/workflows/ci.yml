name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modulo: [pedidos, estoque, pagamento]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes de ${{ matrix.modulo }}
        working-directory: ${{ matrix.modulo }}
        run: ./mvnw -B verify
